<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Customer Desk</title>
  
  <meta name="theme-color" content="#0b0f19" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.25);
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --input-bg: #0a0f1d;
      --border: #222f47;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem 1rem;
    }

    /* CUSTOM TOAST NOTIFICATIONS */
    #toast-wrap {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 400px;
      z-index: 99999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      pointer-events: auto;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.55);
      backdrop-filter: blur(10px);
      animation: slideInDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      border: 1px solid;
    }

    .toast-success {
      background: rgba(16, 185, 129, 0.95);
      color: #ffffff;
      border-color: #34d399;
    }

    .toast-error {
      background: rgba(239, 68, 68, 0.95);
      color: #ffffff;
      border-color: #f87171;
    }

    .toast-info {
      background: rgba(30, 41, 59, 0.95);
      color: #93c5fd;
      border-color: #3b82f6;
    }

    @keyframes slideInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .desk-container {
      width: 100%;
      max-width: 420px;
      margin: auto;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2rem 1.5rem;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
    }

    .shop-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--accent);
      margin-bottom: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .shop-header h1 {
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 0.4rem;
    }

    .shop-header p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 1.15rem;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 0.45rem;
    }

    input, select {
      width: 100%;
      height: 52px;
      padding: 0 1rem;
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .checkbox-wrap {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin: 1.25rem 0 1.5rem;
      cursor: pointer;
    }

    .checkbox-wrap input {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      margin-top: 2px;
      flex-shrink: 0;
    }

    .checkbox-wrap span {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .btn-submit {
      width: 100%;
      height: 54px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 8px 20px var(--accent-glow);
      transition: transform 0.15s, opacity 0.15s;
    }

    .btn-submit:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .state-panel {
      text-align: center;
      padding: 2.2rem 1rem;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .review-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      height: 54px;
      background: var(--success);
      color: #ffffff;
      text-decoration: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      margin-top: 1.5rem;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- FLOATING TOAST CONTAINER -->
  <div id="toast-wrap"></div>

  <div class="desk-container">
    <div class="card">

      <!-- 1. LOADING SCREEN -->
      <div id="loading-panel" class="state-panel">
        <div class="spinner"></div>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Connecting to desk...</p>
      </div>

      <!-- 2. ERROR SCREEN -->
      <div id="error-panel" class="state-panel hidden">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 0.75rem;">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <h2 style="font-size: 1.25rem; margin-bottom: 0.4rem;">Desk Unavailable</h2>
        <p style="color: var(--text-muted); font-size: 0.88rem;" id="error-msg">This counter desk is inactive or not found.</p>
      </div>

      <!-- 3. MAIN CHECK-IN INTERFACE -->
      <div id="desk-content" class="hidden">
        <header class="shop-header">
          <span class="badge" id="desk-badge">Counter Desk</span>
          <h1 id="shop-title">Shop Name</h1>
          <p id="shop-sub">Welcome! Please check in below.</p>
        </header>

        <!-- GOOGLE 1-TAP / BUTTON -->
        <div id="auth-section">
          <div style="display: flex; justify-content: center; margin: 1rem 0 1.25rem;">
            <div id="g_id_onload"
                 data-client_id="913181271941-qvtfqq8l2c2imgpsnsh4k1gbdafr0t8e.apps.googleusercontent.com"
                 data-callback="handleCustomerAuth"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_blue" data-shape="rectangular" data-width="320"></div>
          </div>
          <p style="font-size: 0.8rem; color: var(--text-muted); text-align: center;">Tap above to auto-fill your profile instantly</p>
        </div>

        <!-- INTAKE FORM -->
        <form id="checkin-form" class="hidden" onsubmit="submitVisit(event)">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="cust-name" required placeholder="Enter full name" />
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="cust-email" readonly style="opacity: 0.75;" />
          </div>

          <div class="form-group">
            <label>WhatsApp / Mobile Number *</label>
            <input type="tel" id="cust-phone" required placeholder="10-digit mobile number" pattern="[0-9]{10}" />
          </div>

          <div class="form-group">
            <label>Birthday (For birthday surprise discounts)</label>
            <input type="date" id="cust-dob" />
          </div>

          <div class="form-group">
            <label>Visit Purpose</label>
            <select id="cust-purpose">
              <option value="General Inquiry">General Inquiry</option>
              <option value="Product Purchase">Product Purchase</option>
              <option value="Key Making / Locksmith">Key Making / Locksmith</option>
              <option value="Repair & Service">Repair & Service</option>
            </select>
          </div>

          <label class="checkbox-wrap">
            <input type="checkbox" id="cust-optin" checked />
            <span>Receive digital invoices and special offers via WhatsApp</span>
          </label>

          <button type="submit" id="submit-btn" class="btn-submit">
            <span>Complete Check-In</span>
          </button>
        </form>

        <!-- 4. CHECK-IN COMPLETE SCREEN -->
        <div id="success-panel" class="state-panel hidden">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 0.75rem;">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          <h2 style="font-size: 1.4rem; margin-bottom: 0.35rem;">Check-In Complete!</h2>
          <p style="color: var(--text-muted); font-size: 0.88rem;">Thank you for checking in with us today.</p>

          <div id="review-cta-wrap" class="hidden">
            <a id="review-btn" href="#" target="_blank" rel="noopener noreferrer" class="review-button">
              ⭐ Leave a 5-Star Review
            </a>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxMtCXUFrSRSvJ04tprcN27H5zE6B3aYOq0BCrsV_VcLZrPGZkqR6KvB4dKg-yB1zKG/exec";


    let storeData = null;
    let customerProfile = { name: "", email: "" };

    const $ = id => document.getElementById(id);

    // TOAST NOTIFICATION ENGINE
    function toast(text, type = "info") {
      const wrap = $("toast-wrap");
      if (!wrap) return;

      const el = document.createElement("div");
      el.className = `toast toast-${type}`;
      el.innerHTML = `<span>${text}</span>`;
      wrap.appendChild(el);

      setTimeout(() => {
        el.style.opacity = "0";
        el.style.transform = "translateY(-15px)";
        el.style.transition = "all 0.25s ease";
        setTimeout(() => el.remove(), 250);
      }, 3500);
    }

    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(
          atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
        );
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }

    async function initDesk() {
      const params = new URLSearchParams(window.location.search);
      const slug = (params.get("shop") || "").trim().toLowerCase();

      if (!slug) {
        showError("No store slug detected in URL.");
        return;
      }

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "getStoreConfig", shopId: slug })
        });
        const data = await res.json();

        if (data.status !== "success" || !data.store) {
          showError(data.message || "Store is inactive or does not exist.");
          return;
        }

        storeData = data.store;
        setupUI(storeData);

      } catch (err) {
        showError("Failed to connect to desk server.");
      }
    }

    function setupUI(store) {
      document.title = `${store.shopName} | Desk`;
      $("shop-title").textContent = store.shopName;
      $("shop-sub").textContent = store.tagline || "Welcome! Please check in below.";
      $("desk-badge").textContent = store.shopId;

      if (store.primaryColor) {
        document.documentElement.style.setProperty("--accent", store.primaryColor);
        document.documentElement.style.setProperty("--accent-glow", store.primaryColor + "40");
      }

      $("loading-panel").classList.add("hidden");
      $("desk-content").classList.remove("hidden");
    }

    function showError(msg) {
      $("loading-panel").classList.add("hidden");
      $("error-msg").textContent = msg;
      $("error-panel").classList.remove("hidden");
      toast(msg, "error");
    }

    function handleCustomerAuth(response) {
      const payload = parseJwt(response.credential);
      if (!payload || !payload.email) return;

      customerProfile.name = payload.name || "";
      customerProfile.email = payload.email.toLowerCase();

      $("cust-name").value = customerProfile.name;
      $("cust-email").value = customerProfile.email;

      $("auth-section").classList.add("hidden");
      $("checkin-form").classList.remove("hidden");
      $("cust-phone").focus();

      toast("Google profile connected!", "success");
    }

    async function submitVisit(e) {
      e.preventDefault();
      const btn = $("submit-btn");
      btn.disabled = true;
      btn.innerHTML = `<span>Saving Visit...</span>`;

      const payload = {
        action: "recordCustomerVisit",
        shopId: storeData.shopId,
        name: $("cust-name").value.trim(),
        email: customerProfile.email || $("cust-email").value.trim(),
        mobile: $("cust-phone").value.trim(),
        dob: $("cust-dob").value,
        visitType: $("cust-purpose").value,
        whatsappOptIn: $("cust-optin").checked
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        $("checkin-form").classList.add("hidden");
        $("shop-title").classList.add("hidden");
        $("shop-sub").classList.add("hidden");
        $("desk-badge").classList.add("hidden");

        $("success-panel").classList.remove("hidden");
        toast("Check-in saved successfully!", "success");

        if (storeData.reviewUrl && storeData.reviewUrl.trim().length > 5) {
          $("review-btn").href = storeData.reviewUrl.trim();
          $("review-cta-wrap").classList.remove("hidden");
        }

      } catch (err) {
        toast("Network error. Saved offline.", "error");
      }
    }

    window.addEventListener("DOMContentLoaded", initDesk);
  </script>
</body>
</html>
