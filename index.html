<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Connect Desk</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.25rem;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 440px;
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid var(--border);
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 0.5rem;
      text-align: center;
      width: 100%;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      margin-bottom: 0.35rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .auth-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: #f1f5f9;
      border-radius: 10px;
      margin-bottom: 1.25rem;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .user-info {
      overflow: hidden;
    }

    .user-name {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .user-email {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .form-group {
      margin-bottom: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .dob-age-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.1rem;
    }

    .dob-age-row .form-group {
      margin-bottom: 0;
    }

    label {
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--text);
    }

    input, select, textarea {
      width: 100%;
      padding: 0.75rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    input[readonly] {
      background-color: #f1f5f9;
      color: #334155;
      font-weight: 600;
      cursor: not-allowed;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    button.submit-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.85rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }

    button.submit-btn:hover {
      background: var(--primary-hover);
    }

    button.submit-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">Customer Connect Desk</span>
    <h1 id="shop-name">Memon Lock Center</h1>
    <p class="subtitle" id="shop-tagline">Quick Digital Check-In & Service Records</p>

    <!-- Sign-in Screen -->
    <div id="signin-view" class="auth-section">
      <div id="g_id_onload"
        data-client_id="913181271941-qvtfqq8l2c2imgpsnsh4k1gbdafr0t8e.apps.googleusercontent.com"
        data-callback="handleCredentialResponse"
        data-auto_prompt="false">
      </div>
      <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="continue_with" data-shape="rectangular" data-logo_alignment="left"></div>
    </div>

    <!-- Check-in Form Screen -->
    <form id="form-view" class="hidden" onsubmit="submitForm(event)">
      <div class="user-profile">
        <div class="avatar" id="user-avatar">?</div>
        <div class="user-info">
          <div class="user-name" id="user-name">User Name</div>
          <div class="user-email" id="user-email">email@example.com</div>
        </div>
      </div>

      <div class="form-group">
        <label for="phone">WhatsApp / Mobile Number *</label>
        <input type="tel" id="phone" required placeholder="Enter 10-digit number" pattern="[0-9]{10}" />
      </div>

      <!-- DOB & Auto-Calculated Age Grid -->
      <div class="dob-age-row">
        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" onchange="calculateAge()" />
        </div>
        <div class="form-group">
          <label for="age">Age</label>
          <input type="text" id="age" placeholder="Auto" readonly />
        </div>
      </div>

      <div class="form-group">
        <label for="category">Service Category / Purpose</label>
        <select id="category">
          <option value="Duplicate Keys / Lock Repair">Duplicate Keys / Lock Repair</option>
          <option value="New Lock Purchase / Installation">New Lock Purchase / Installation</option>
          <option value="Digital / Smart Lock Inquiry">Digital / Smart Lock Inquiry</option>
          <option value="Warranty / Service Check">Warranty / Service Check</option>
          <option value="General Visit" selected>General Visit</option>
        </select>
      </div>

      <div class="form-group">
        <label for="notes">Notes / Specifications (Optional)</label>
        <textarea id="notes" placeholder="e.g., 2 Godrej keys duplicated"></textarea>
      </div>

      <button type="submit" class="submit-btn">Complete Check-In</button>
    </form>
  </div>

  <script>
    // 1. Dynamic Shop Name detection from URL (?shop=Name)
    const urlParams = new URLSearchParams(window.location.search);
    const customShopName = urlParams.get('shop');
    if (customShopName) {
      document.getElementById('shop-name').textContent = customShopName;
      document.title = customShopName + " - Customer Check-In";
    }

    let customerData = {
      name: '',
      email: '',
      phone: '',
      dob: '',
      age: '',
      shop: customShopName || 'Memon Lock Center'
    };

    // 2. Decode Google Sign-In JWT token
    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
      const payload = parseJwt(response.credential);
      customerData.name = payload.name;
      customerData.email = payload.email;

      document.getElementById('user-name').textContent = payload.name;
      document.getElementById('user-email').textContent = payload.email;
      document.getElementById('user-avatar').textContent = payload.name.charAt(0).toUpperCase();

      document.getElementById('signin-view').classList.add('hidden');
      document.getElementById('form-view').classList.remove('hidden');
    }

    // 3. Accurate Age Calculation Logic
    function calculateAge() {
      const dobInput = document.getElementById('dob').value;
      const ageField = document.getElementById('age');

      if (!dobInput) {
        ageField.value = '';
        customerData.age = '';
        return;
      }

      const birthDate = new Date(dobInput);
      const today = new Date();

      let calculatedAge = today.getFullYear() - birthDate.getFullYear();
      const monthDifference = today.getMonth() - birthDate.getMonth();

      if (monthDifference < 0 || (monthDifference === 0 && today.getDate() < birthDate.getDate())) {
        calculatedAge--;
      }

      if (calculatedAge >= 0) {
        ageField.value = calculatedAge;
        customerData.age = calculatedAge;
      } else {
        ageField.value = '';
        customerData.age = '';
      }
    }

    // 4. Form Submission to Google Apps Script
    const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

    async function submitForm(event) {
      event.preventDefault();

      const submitBtn = document.querySelector('.submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      customerData.phone = document.getElementById('phone').value;
      customerData.dob = document.getElementById('dob').value;
      customerData.category = document.getElementById('category').value;
      customerData.notes = document.getElementById('notes').value;

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(customerData)
        });

        alert('Check-in successful for ' + customerData.shop + '!');
        document.getElementById('form-view').reset();
        document.getElementById('age').value = '';
      } catch (err) {
        console.error('Submission error:', err);
        alert('Submission failed. Please check your connection.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Complete Check-In';
      }
    }
  </script>
</body>
</html>
//done
