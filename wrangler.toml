name = "ccd-wildcard-router"
main = "worker.js"
compatibility_date = "2026-11-07"

# Attach both the apex platform hostname and all tenant subdomains.
# Keep DNS proxied. The Pages project remains the static asset origin.
routes = [
  { pattern = "ccd.dev/*", zone_name = "ccd.dev" },
  { pattern = "*.ccd.dev/*", zone_name = "ccd.dev" }
]

[vars]
PAGES_ORIGIN = "https://customer-connect-desk.pages.dev"
PUBLIC_MEDIA_BASE = "https://media.ccd.dev"
GAS_URL = "https://script.google.com/macros/s/AKfycbyoFCx6UgGKFmgDxkQePZOuWhWEGqNn5wro0qXfGvb8d31hhTkzZKjMFnCDB9z93wmi/exec"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "ccd-public-media"
