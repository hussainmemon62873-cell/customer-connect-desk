<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>Official Store</title>
  <meta name="robots" content="index, follow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shop.css" />
</head>
<body>

  <!-- Top Sticky Navigation (Populated dynamically) -->
  <header class="site-header">
    <div class="nav-container">
      <div class="brand-link" onclick="switchTab('home')">
        <span class="brand-mark">🏪</span>
        <span class="nav-store-name" id="nav-brand">Loading Store…</span>
      </div>
      <nav class="nav-links" id="dynamic-nav"></nav>
    </div>
  </header>

  <!-- Auto-Scrolling Carousel (Only visible if 1+ banners exist) -->
  <div class="carousel-container" id="carousel-wrap" style="display: none;">
    <div class="carousel-track" id="carousel-track"></div>
    <div class="carousel-dots" id="carousel-dots"></div>
  </div>

  <main class="store-container">
    
    <!-- TAB 1: HOME (Live Status, Timings, Direct Contacts) -->
    <section class="tab-view active" id="view-home">
      <div class="brand-card" id="hero-card">
        <h1 class="store-title" id="shop-name">Store Title</h1>
        <p class="store-tagline" id="shop-tagline"></p>
        <div class="status-pill" id="shop-status-pill">
          <span class="pulse-dot"></span>
          <span id="shop-status-text">Checking…</span>
        </div>
        <div class="action-grid" id="shop-actions"></div>
      </div>

      <div class="info-card">
        <div class="info-row">
          <span class="info-label">Today's Closing Time</span>
          <span class="info-val" id="info-closing-time">--</span>
        </div>
        <div class="info-row" id="row-phone">
          <span class="info-label">Contact Number</span>
          <span class="info-val" id="info-phone">--</span>
        </div>
        <div class="info-row">
          <span class="info-label">Merchant Verification</span>
          <span class="info-val" style="color:var(--ok);">Verified Business</span>
        </div>
      </div>
    </section>

    <!-- TAB 2: SERVICES (Rendered as individual visual cards) -->
    <section class="tab-view" id="view-services">
      <h2 class="section-heading">Services Offered</h2>
      <div class="services-list" id="services-container"></div>
    </section>

    <!-- TAB 3: ABOUT -->
    <section class="tab-view" id="view-about">
      <h2 class="section-heading">About Us</h2>
      <div class="content-box" id="about-container"></div>
    </section>

    <!-- TAB 4: PRICING -->
    <section class="tab-view" id="view-pricing">
      <h2 class="section-heading">Pricing & Estimates</h2>
      <div class="pricing-list" id="pricing-container"></div>
    </section>

    <!-- TAB 5: BLOG / UPDATES -->
    <section class="tab-view" id="view-blog">
      <h2 class="section-heading">Latest Updates</h2>
      <div class="blog-list" id="blog-container"></div>
    </section>

    <!-- TAB 6: CONTACT -->
    <section class="tab-view" id="view-contact">
      <h2 class="section-heading">Location & Inquiries</h2>
      <div class="content-box" id="contact-container"></div>
    </section>

  </main>

  <!-- Google Ads & AdSense Compliant Policy Footer -->
  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-policy-links">
        <button type="button" class="policy-link" onclick="openPolicyModal('privacy')">Privacy Policy</button>
        <button type="button" class="policy-link" onclick="openPolicyModal('terms')">Terms & Conditions</button>
        <button type="button" class="policy-link" onclick="openPolicyModal('cookies')">Cookie Policy</button>
        <button type="button" class="policy-link" onclick="openPolicyModal('faq')">FAQ</button>
      </div>
      <p class="footer-copy">© <span id="footer-year"></span> <span id="footer-name">Store</span>. All rights reserved.</p>
      <p class="footer-badge">Powered by Customer Connect Desk</p>
    </div>
  </footer>

  <!-- Built-in Global Policy Modal -->
  <div class="modal-overlay" id="policy-modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modal-title">Policy</h3>
        <button type="button" class="modal-close" onclick="closePolicyModal()">&times;</button>
      </div>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <script src="shop.js"></script>
</body>
</html>
