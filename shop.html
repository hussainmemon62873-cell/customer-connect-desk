<!doctype html><html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff">
<meta name="description" content="Official shop website">
<title>Official Shop | Customer Connect Desk</title>
<link rel="stylesheet" href="shop.css">
<script src="shop.js" defer>
</script>
</head>
<body>
<header class="shop-header"><div class="shop-header-inner">
<button class="brand-switch" type="button" onclick="switchTab('home')">
<span class="shop-mark">CC</span><span id="nav-brand">Loading shop…</span>
</button>
<nav class="nav-links" id="dynamic-nav" aria-label="Shop navigation">
<button class="nav-btn active" type="button" onclick="switchTab('home')">Home</button>
</nav>
</div>
</header>
<section class="carousel-container" id="carousel-wrap" style="display:none"><div class="carousel-track" id="carousel-track">
</div>
<div class="carousel-dots" id="carousel-dots">
</div>
</section>
<main class="store-container"><section class="tab-view active" id="view-home">
<article class="brand-card" id="hero-card">
<p class="eyebrow">WELCOME</p>
<h1 class="store-title" id="shop-name">Your shop</h1><p class="store-tagline" id="shop-tagline">
</p><div class="status-pill" id="shop-status-pill">
<span class="pulse-dot">
</span>
<span id="shop-status-text">Checking store status…</span>
</div><div id="shop-actions" class="action-grid">
</div><div id="home-content" class="content-box">
</div></article><article class="info-card">
<div class="info-row">
<span class="info-label">Today's closing time</span><strong id="info-closing-time">9:00 PM</strong></div><div class="info-row" id="row-phone">
<span class="info-label">Contact</span><strong id="info-phone">Not provided</strong>
</div>
</article>
</section>
<section class="tab-view" id="view-services"><h2 class="section-heading">Services</h2><div class="services-list" id="services-container"></div></section><section class="tab-view" id="view-about"><h2 class="section-heading">About us</h2><div class="content-box" id="about-container">
</div>
</section>
<section class="tab-view" id="view-pricing"><h2 class="section-heading">Pricing and estimates</h2><div class="pricing-list" id="pricing-container">
</div></section><section class="tab-view" id="view-blog"><h2 class="section-heading">Latest updates</h2><div class="blog-list" id="blog-container"></div></section><section class="tab-view" id="view-contact"><h2 class="section-heading">Location and inquiries</h2><div class="content-box" id="contact-container">
</div></section>
</main><footer class="shop-footer">
<div><strong id="footer-name">Customer Connect Desk</strong><span>Powered by Customer Connect Desk</span></div><div class="policy-links"><button type="button" onclick="openPolicyModal('privacy')">Privacy</button><button type="button" onclick="openPolicyModal('terms')">Terms</button><button type="button" onclick="openPolicyModal('cookies')">Cookies</button>
<button type="button" onclick="openPolicyModal('faq')">FAQ</button>
</div><small>© <span id="footer-year"></span></small></footer><div id="policy-modal" class="policy-modal" hidden><section class="policy-card"><div class="policy-heading"><h2 id="modal-title">Policy</h2><button type="button" onclick="closePolicyModal()" aria-label="Close policy">×</button>
</div><div id="modal-content" class="policy-content"></div></section></div></body>
</html>
